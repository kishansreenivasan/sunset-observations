# Static site: no build step, publish the repo root as-is.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/sketches/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
